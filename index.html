<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <style>
        :root {
            --ink: #202528;
            --muted: #5f696d;
            --paper: #fff8ed;
            --wall: #ead9c4;
            --wall-deep: #d5bea4;
            --wood: #8b5a35;
            --wood-dark: #4b2b1a;
            --green: #546d57;
            --blue: #3f687f;
            --gold: #b47a30;
            --shadow: 0 24px 58px rgba(37, 27, 18, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            color: var(--ink);
            font-family: "Inter", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            background: #151b18;
        }

        a,
        button {
            font: inherit;
        }

        .house-stage {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
            background: #111815;
            cursor: zoom-in;
        }

        .house-image,
        .open-door-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .house-image {
            object-position: center center;
            transform: scale(1);
            transition: transform 900ms cubic-bezier(.2, .76, .2, 1), object-position 900ms cubic-bezier(.2, .76, .2, 1), filter 500ms ease;
        }

        .house-stage.is-focused {
            cursor: pointer;
        }

        .house-stage.is-focused .house-image {
            object-position: 50% 66%;
            transform: scale(2.45);
            filter: saturate(1.04) contrast(1.03);
        }

        .open-door-image {
            z-index: 3;
            opacity: 0;
            pointer-events: none;
            object-position: center center;
            transform: scale(1.03);
            transition: opacity 180ms ease;
        }

        .house-stage.is-opening .open-door-image {
            opacity: 1;
        }

        .house-shade {
            position: absolute;
            inset: 0;
            z-index: 1;
            background:
                radial-gradient(circle at 50% 64%, transparent 0 16%, rgba(0, 0, 0, 0.24) 45%, rgba(0, 0, 0, 0.52) 100%),
                linear-gradient(180deg, rgba(0, 0, 0, 0.04), rgba(0, 0, 0, 0.34));
            transition: opacity 600ms ease;
        }

        .house-stage.is-focused .house-shade {
            opacity: 0.48;
        }

        .door-hotspot {
            position: absolute;
            z-index: 4;
            left: 43%;
            top: 51%;
            width: 14%;
            height: 21%;
            border: 0;
            border-radius: 999px 999px 8px 8px;
            background: transparent;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
        }

        .house-stage.is-focused .door-hotspot {
            opacity: 1;
            pointer-events: auto;
        }

        .door-pulse {
            position: absolute;
            z-index: 2;
            left: 50%;
            top: 65%;
            width: 86px;
            height: 86px;
            border-radius: 50%;
            translate: -50% -50%;
            border: 1px solid rgba(255, 248, 226, 0.85);
            box-shadow: 0 0 0 0 rgba(255, 248, 226, 0.34);
            opacity: 0;
            pointer-events: none;
            animation: pulse 1.45s ease-out infinite;
        }

        .house-stage.is-focused .door-pulse {
            opacity: 1;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.72);
                box-shadow: 0 0 0 0 rgba(255, 248, 226, 0.36);
            }

            100% {
                transform: scale(1.2);
                box-shadow: 0 0 0 24px rgba(255, 248, 226, 0);
            }
        }

        .top-nav {
            position: fixed;
            z-index: 20;
            top: 18px;
            left: 50%;
            display: flex;
            gap: 8px;
            padding: 7px;
            border-radius: 999px;
            background: rgba(22, 28, 25, 0.58);
            backdrop-filter: blur(14px);
            transform: translateX(-50%);
        }

        .top-nav a {
            min-height: 36px;
            padding: 8px 14px;
            border-radius: 999px;
            color: #fff8ea;
            text-decoration: none;
            white-space: nowrap;
        }

        .photo-wall,
        .project-room {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
        }

        .photo-wall {
            display: grid;
            place-items: center;
            padding: 90px 24px 70px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.32), transparent 34%),
                linear-gradient(160deg, #efe2d0 0 70%, #b98052 70% 100%);
        }

        .photo-wall::before,
        .project-room::before {
            content: "";
            position: absolute;
            left: -8%;
            right: -8%;
            bottom: -2%;
            height: 30%;
            background:
                repeating-linear-gradient(96deg, rgba(255, 255, 255, 0.11) 0 2px, transparent 2px 72px),
                linear-gradient(180deg, #b87b4f, #744629);
            transform: skewY(-2deg);
            transform-origin: bottom left;
        }

        .wall-inner {
            position: relative;
            z-index: 1;
            width: min(1160px, 100%);
        }

        .section-head {
            max-width: 760px;
            margin: 0 auto 34px;
            text-align: center;
        }

        .section-head h2 {
            margin: 0 0 10px;
            font-size: clamp(2rem, 5vw, 4rem);
            line-height: 1;
            letter-spacing: 0;
        }

        .section-head p {
            margin: 0;
            color: var(--muted);
            line-height: 1.8;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: clamp(14px, 2vw, 24px);
            align-items: center;
        }

        .photo-frame {
            position: relative;
            min-height: 220px;
            padding: 12px;
            border: 9px solid var(--wood);
            border-radius: 8px;
            background: #fffaf1;
            box-shadow: var(--shadow);
            transform: rotate(var(--tilt));
        }

        .photo-frame:nth-child(1) { --tilt: -2deg; }
        .photo-frame:nth-child(2) { --tilt: 1.4deg; border-color: var(--blue); }
        .photo-frame:nth-child(3) { --tilt: -1.1deg; border-color: var(--green); }
        .photo-frame:nth-child(4) { --tilt: 2deg; }
        .photo-frame:nth-child(5) { --tilt: 1deg; border-color: #9a6a38; }
        .photo-frame:nth-child(6) { --tilt: -1.8deg; }
        .photo-frame:nth-child(7) { --tilt: 1.7deg; border-color: #6e5876; }
        .photo-frame:nth-child(8) { --tilt: -0.8deg; border-color: #5f6b55; }

        .photo-frame.tall {
            min-height: 300px;
        }

        .photo-frame img,
        .frame-placeholder {
            width: 100%;
            height: 100%;
            min-height: inherit;
            object-fit: contain;
            display: block;
            border-radius: 4px;
            background: #fffdf8;
        }

        .frame-placeholder {
            display: grid;
            place-items: center;
            padding: 18px;
            text-align: center;
            color: #7a6149;
            line-height: 1.55;
        }

        .project-room {
            padding: 92px 24px 70px;
            background:
                radial-gradient(circle at 18% 18%, rgba(255, 249, 232, 0.7), transparent 24%),
                linear-gradient(180deg, #e8dac8 0 68%, #af7650 68% 100%);
        }

        .project-inner {
            position: relative;
            z-index: 1;
            width: min(1120px, 100%);
            min-height: calc(100vh - 162px);
            margin: 0 auto;
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 34px;
        }

        .easel-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(260px, 1fr));
            gap: clamp(28px, 6vw, 76px);
            align-items: end;
        }

        .easel-link {
            position: relative;
            display: grid;
            justify-items: center;
            color: var(--ink);
            text-decoration: none;
            transition: transform 220ms ease;
        }

        .easel-link:hover {
            transform: translateY(-8px);
        }

        .canvas {
            position: relative;
            z-index: 2;
            width: min(430px, 100%);
            min-height: 390px;
            padding: 18px;
            border: 12px solid #7b4b2f;
            border-radius: 8px;
            background: #fffaf1;
            box-shadow: var(--shadow);
        }

        .canvas img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            border-radius: 5px;
            background: #fff;
        }

        .canvas strong {
            display: block;
            margin: 18px 0 8px;
            font-size: clamp(1.3rem, 2.2vw, 1.7rem);
        }

        .canvas span {
            display: block;
            color: var(--muted);
            line-height: 1.6;
        }

        .easel-legs {
            position: relative;
            z-index: 1;
            width: min(390px, 88%);
            height: 210px;
            margin-top: -20px;
        }

        .easel-legs::before,
        .easel-legs::after,
        .back-leg {
            content: "";
            position: absolute;
            top: 0;
            width: 14px;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(180deg, #8b5a35, #4b2b1a);
            transform-origin: top center;
        }

        .easel-legs::before {
            left: 25%;
            transform: rotate(11deg);
        }

        .easel-legs::after {
            right: 25%;
            transform: rotate(-11deg);
        }

        .back-leg {
            left: 50%;
            height: 92%;
            transform: translateX(-50%) rotate(2deg);
            opacity: 0.82;
        }

        .rail {
            position: absolute;
            left: 18%;
            right: 18%;
            top: 46px;
            height: 12px;
            border-radius: 999px;
            background: #5a3522;
        }

        .contact-strip {
            position: relative;
            z-index: 1;
            width: min(1120px, calc(100% - 48px));
            margin: 26px auto 0;
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 18px;
            border-radius: 8px;
            color: #fff7e7;
            background: rgba(31, 37, 40, 0.88);
            box-shadow: 0 18px 36px rgba(31, 37, 40, 0.2);
        }

        .contact-strip a {
            color: #fff7e7;
        }

        @media (max-width: 900px) {
            .gallery-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .easel-row {
                grid-template-columns: 1fr;
            }

            .project-inner {
                min-height: auto;
            }
        }

        @media (max-width: 560px) {
            .top-nav {
                top: 10px;
                width: calc(100% - 20px);
                justify-content: center;
            }

            .top-nav a {
                padding: 8px 10px;
                font-size: 0.88rem;
            }

            .house-stage.is-focused .house-image {
                object-position: 50% 64%;
                transform: scale(2.85);
            }

            .door-hotspot {
                left: 39%;
                top: 48%;
                width: 22%;
                height: 28%;
            }

            .gallery-grid {
                gap: 14px;
            }

            .photo-frame,
            .photo-frame.tall {
                min-height: 190px;
                padding: 8px;
                border-width: 7px;
            }

            .photo-wall,
            .project-room {
                padding-inline: 14px;
            }

            .canvas {
                min-height: 350px;
                padding: 14px;
            }

            .canvas img {
                height: 210px;
            }

            .contact-strip {
                width: calc(100% - 28px);
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <nav class="top-nav" aria-label="页面导航">
        <a href="#house">入口</a>
        <a href="#photo-wall">照片墙</a>
        <a href="#projects">项目</a>
    </nav>

    <main>
        <section id="house" class="house-stage" aria-label="房子入口">
            <img class="house-image" src="房子.jpg" alt="林间小屋入口">
            <img class="open-door-image" src="开门.png" alt="打开门后的房子入口">
            <div class="house-shade" aria-hidden="true"></div>
            <div class="door-pulse" aria-hidden="true"></div>
            <button class="door-hotspot" type="button" aria-label="打开房门"></button>
        </section>

        <section id="photo-wall" class="photo-wall" aria-label="照片墙">
            <div class="wall-inner">
                <div class="section-head">
                    <h2>照片墙</h2>
                    <p>这里陈列我的获奖证书、竞赛记录和重要荣誉。</p>
                </div>
                <div class="gallery-grid">
                    <article class="photo-frame tall">
                        <img src="国家奖学金.png" alt="国家奖学金证书">
                    </article>
                    <article class="photo-frame">
                        <img src="一等奖学金.png" alt="一等奖学金证书">
                    </article>
                    <article class="photo-frame tall">
                        <img src="优秀学生.jpg" alt="优秀学生证书">
                    </article>
                    <article class="photo-frame">
                        <img src="挑战杯.png" alt="挑战杯证书">
                    </article>
                    <article class="photo-frame">
                        <img src="美赛.png" alt="美赛证书">
                    </article>
                    <article class="photo-frame tall">
                        <img src="大创.jpg" alt="大创证书">
                    </article>
                    <article class="photo-frame">
                        <img src="数模省二.jpg" alt="数学建模省二等奖证书">
                    </article>
                    <article class="photo-frame tall">
                        <img src="省赛_软件类_C++B组_二等奖_刘明方_1602041313_1765278.jpg" alt="省赛软件类 C++ B 组二等奖证书">
                    </article>
                </div>
            </div>
        </section>

        <section id="projects" class="project-room" aria-label="项目展示房间">
            <div class="project-inner">
                <div class="section-head">
                    <h2>项目展示</h2>
                    <p>两个立式画架分别展示项目图片，点击画布即可进入对应 GitHub 仓库。</p>
                </div>

                <div class="easel-row">
                    <a class="easel-link" href="https://github.com/liumfg/taidi" target="_blank" rel="noopener noreferrer" aria-label="打开 taidi 项目">
                        <div class="canvas">
                            <img src="xiangmu2.png" alt="taidi 项目图片">
                            <strong>taidi</strong>
                            <span>竞赛与算法项目展示，点击进入 GitHub 仓库查看代码与说明。</span>
                        </div>
                        <div class="easel-legs" aria-hidden="true">
                            <span class="back-leg"></span>
                            <span class="rail"></span>
                        </div>
                    </a>

                    <a class="easel-link" href="https://github.com/liumfg/LifePilot" target="_blank" rel="noopener noreferrer" aria-label="打开 LifePilot 项目">
                        <div class="canvas">
                            <img src="xiangmu1.png" alt="LifePilot 项目图片">
                            <strong>LifePilot</strong>
                            <span>个人效率与生活管理方向项目，点击进入 GitHub 仓库查看代码与说明。</span>
                        </div>
                        <div class="easel-legs" aria-hidden="true">
                            <span class="back-leg"></span>
                            <span class="rail"></span>
                        </div>
                    </a>
                </div>
            </div>

            <footer class="contact-strip">
                <span>邮箱：<a href="mailto:liumfang0113@gmail.com">liumfang0113@gmail.com</a></span>
                <span>欲渡关山，何惧狂澜，风生水起，正好扬帆。</span>
            </footer>
        </section>
    </main>

    <script>
        const houseStage = document.querySelector(".house-stage");
        const doorHotspot = document.querySelector(".door-hotspot");

        houseStage.addEventListener("click", () => {
            if (!houseStage.classList.contains("is-focused")) {
                houseStage.classList.add("is-focused");
            }
        });

        doorHotspot.addEventListener("click", (event) => {
            event.stopPropagation();
            houseStage.classList.add("is-opening");

            window.setTimeout(() => {
                document.querySelector("#photo-wall").scrollIntoView({ behavior: "smooth" });
            }, 520);

            window.setTimeout(() => {
                houseStage.classList.remove("is-opening");
            }, 1200);
        });
    </script>
</body>

</html>
